#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "svg-path-editor"
name = "SVG Editor"
description.en = "Online editor to create and manipulate SVG paths"
description.fr = "Éditeur en ligne pour créer et manipuler des chemins SVG"

version = "2026.04.18~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
demo = "https://yqnn.github.io/svg-path-editor/"
code = "https://github.com/Yqnn/svg-path-editor"


[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Yqnn/svg-path-editor/archive/84b2b94c3c2b9a0d583056ffebff6b65754e22ff.tar.gz"
    sha256 = "064526fa5b1f59094feaaa4a2116b410adbd468507f8d301de32546434fdf8e4"

    autoupdate.upstream = "https://github.com/Yqnn/svg-path-editor"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.nodejs]
    version = "22"
    