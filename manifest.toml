#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "svg-path-editor"
name = "SVG Editor"
description.en = "Online editor to create and manipulate SVG paths"
description.fr = "Éditeur en ligne pour créer et manipuler des chemins SVG"

version = "2026.11.15~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
demo = "https://yqnn.github.io/svg-path-editor/"
code = "https://github.com/Yqnn/svg-path-editor"


[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Yqnn/svg-path-editor/archive/07175877851154893aad200f034ef61f48c99c50.tar.gz"
    sha256 = "2b5acf8126f2bfce0a18177587dc6f3f4a731b3f5bc216ec3b188be273e8f637"

    autoupdate.upstream = "https://github.com/Yqnn/svg-path-editor"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.nodejs]
    version = "22"
    